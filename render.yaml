services:
  - type: web
    name: mathquest-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r src/backend/requirements.txt
    startCommand: python -m uvicorn src.backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: PAI_PASSWORD
        value: nikolas2024
      - key: PYTHONPATH
        value: .
